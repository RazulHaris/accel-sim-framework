    \n-accelwattch_hybrid_perfsim_L2_RH 1
    \n-accelwattch_hybrid_perfsim_L2_RM 1
    \n-accelwattch_hybrid_perfsim_L2_WH 1
    \n-accelwattch_hybrid_perfsim_L2_WM 1
    \n-accelwattch_hybrid_perfsim_NOC 1"

Accelwattch_PTX_SIM:
    extra_params: "-power_simulation_enabled 1
    \n-power_simulation_mode 0
    \n-accelwattch_xml_file accelwattch_ptx_sim.xml"

# ---- Snake prefetcher (Mostofi et al., MICRO 2023) -------------------------
# See docs/snake/SNAKE_PLAN.md (sections 6 and 10).  Baseline and Snake runs
# use the same base config; only the SNAKE* token differs.

# Paper GPU setup (Tab. 1): GTO scheduler and a 1530 MHz clock on QV100.  The
# interconnect and L2 clocks follow the core clock, as in the stock QV100.
PAPER_V100:
    extra_params: "-gpgpu_scheduler gto
    \n-gpgpu_clock_domains 1530.0:1530.0:1530.0:850.0"

# Paper Table 1 latencies, for the final evaluation only.  Both are treated
# as measured values and calibrated with the l2_lat microbenchmark
# (sim_run_snake_calib, docs/snake/results/S3e.md §3, S4.md §0): L1 knob 23
# measures an L1 hit of 28 cycles (S4; S3e used 28, which measures 33), and
# L2 ROP latency 199 an L2 hit of 212 (173 with the stock 160).  Use with
# PAPER_V100.
PAPER_LAT:
    extra_params: "-gpgpu_l1_latency 23
    \n-gpgpu_l2_rop_latency 199"

# Clock-sensitivity variant (OQ-23): GTO at QV100's calibrated 1132 MHz.
PAPER_V100_1132:
    extra_params: "-gpgpu_scheduler gto"

SNAKE:
    extra_params: "-snake_enable 1"

# Snake-DT: no decoupling, no throttling (paper section 4)
SNAKE_DT:
    extra_params: "-snake_enable 1
    \n-snake_decouple_mode 0
    \n-snake_throttle_enable 0"

# Snake-T: decoupling without throttling (paper section 4)
SNAKE_T:
    extra_params: "-snake_enable 1
    \n-snake_throttle_enable 0"

# s-Snake: inter-thread chains only (paper section 4)
S_SNAKE:
    extra_params: "-snake_enable 1
    \n-snake_enable_inter_warp 0
    \n-snake_enable_intra_warp 0"

# Isolated-Snake: prefetches in a separate buffer (paper section 5.7)
SNAKE_ISO:
    extra_params: "-snake_enable 1
    \n-snake_decouple_mode 2"

# Snake test configs (docs/snake/SNAKE_PLAN.md section 9.2).
# Per-event Snake log on stdout ("SNAKE_DBG ..."); for synthetic traces only.
SNAKE_DBG:
    extra_params: "-snake_debug_trace 1"

# Paper-literal lane check (section 3.4): train only on warps whose active
# lanes are equally spaced, instead of the default lane-pattern match (OQ-17).
SNAKE_LANE0:
    extra_params: "-snake_lane_mode 0"

# Exact prefetch footprint: replay the target load's lane descriptor (OQ-9);
# the default is one 128 B line per prediction.
SNAKE_FP1:
    extra_params: "-snake_footprint 1"

# Miss-queue slots kept free for demand (OQ-11), for the S3a choice of the
# -snake_missq_reserve default and the S5 sweep.
SNAKE_MQR2:
    extra_params: "-snake_missq_reserve 2"
SNAKE_MQR4:
    extra_params: "-snake_missq_reserve 4"
SNAKE_MQR8:
    extra_params: "-snake_missq_reserve 8"
# No reserved slots (SK match, Step 1)
SNAKE_MQR0:
    extra_params: "-snake_missq_reserve 0"

# Paper-literal inter-warp prefetching (OQ-29): no promoted inter-thread chain
# from the inter-warp targets, as in the paper's Fig. 15 (c).  The default
# from S3e.
SNAKE_IWC0:
    extra_params: "-snake_interwarp_chain_depth 0"

# Our combined-lookahead extension (OQ-29): each inter-warp target follows up
# to 3 promoted inter-thread strides (the S3b-S3d default).
SNAKE_IWC3:
    extra_params: "-snake_interwarp_chain_depth 3"

# Paper-literal Tail eviction (OQ-30): warpID popcount only, no extra weight
# for a trained inter-warp stride.
SNAKE_IWW0:
    extra_params: "-snake_interwarp_weight 0"

# S3c behaviour (OQ-32): a promoted inter-thread stride predicts only for
# warps holding their warpID bit (plus the one-shot promotion predictions).
SNAKE_PAW0:
    extra_params: "-snake_promoted_all_warps 0"

# The S4 reading of decoupling mode 1 (OQ-12, OQ-15): untrained cap until the
# first promotion, any prefetched line freed from the prefetch side, one flag
# per line.  The default from S4b is the revised variant 1.
SNAKE_DV0:
    extra_params: "-snake_decouple_variant 0"

# Fig. 20/22 sweep: Tail entries (default 10).
SNAKE_TAIL20:
    extra_params: "-snake_tail_entries 20"
SNAKE_TAIL40:
    extra_params: "-snake_tail_entries 40"

# "Unlimited" Tail (Fig. 20): 1024 entries, above any SM's allocations
# within one kernel launch in our runs (SPEC OQ-3, S5).
SNAKE_TAILINF:
    extra_params: "-snake_tail_entries 1024"

# Fig. 22: Tail eviction by warpID popcount only (default lru_popcount).
SNAKE_EVPOP:
    extra_params: "-snake_tail_evict popcount"

# Fig. 23 sweep: space-throttle halt in cycles (default 50).
SNAKE_THR25:
    extra_params: "-snake_throttle_space_cycles 25"
SNAKE_THR75:
    extra_params: "-snake_throttle_space_cycles 75"
SNAKE_THR100:
    extra_params: "-snake_throttle_space_cycles 100"
SNAKE_THR150:
    extra_params: "-snake_throttle_space_cycles 150"
SNAKE_THR200:
    extra_params: "-snake_throttle_space_cycles 200"
SNAKE_THR300:
    extra_params: "-snake_throttle_space_cycles 300"

# S5 Tier 2, sensitivity to our interpretations (one change each).
# Inter-warp targets per load (OQ-8, default 4).
SNAKE_IWD1:
    extra_params: "-snake_interwarp_degree 1"
SNAKE_IWD2:
    extra_params: "-snake_interwarp_degree 2"
SNAKE_IWD8:
    extra_params: "-snake_interwarp_degree 8"

# Stale age of unused prefetched data, variant 1 (OQ-12, default 50).
SNAKE_STALE200:
    extra_params: "-snake_pf_stale_cycles 200"
SNAKE_STALE1000:
    extra_params: "-snake_pf_stale_cycles 1000"

# Bandwidth meter in data bytes instead of request slots (OQ-10).
SNAKE_BWBYTES:
    extra_params: "-snake_bw_mode 1"

# Prefetch queue lines (OQ-4, default 32).
SNAKE_Q64:
    extra_params: "-snake_queue_size 64"

# Prefetch lines issued per cycle (OQ-4, default 1).
SNAKE_ISSUE2:
    extra_params: "-snake_issue_width 2"

# S6 experiment (OQ-8 extension): inter-warp targets beyond the CTA.  1 = the
# next warps by global warp id among all resident warps; 2 = the same warp
# index in the next resident CTAs.  Default 0 = same CTA (paper reading).
SNAKE_IWS1:
    extra_params: "-snake_interwarp_scope 1"
SNAKE_IWS2:
    extra_params: "-snake_interwarp_scope 2"

# SK_SC: Snake as SnakeCharmer's baseline "SK" sets it (Tang et al., MICRO
# 2026, arXiv 2610.30990, §III-A): one 128-entry prefetch queue; maximum
# prefetch distances 10 (inter-PC chain), 8 (intra-warp, every iteration
# 1..8, OQ-34) and 63 (inter-warp: lagging resident warps by global warp id,
# nearest first, OQ-33); prefetch once a training confidence reaches 3
# (OQ-35).  Use on top of SNAKE-SNAKE_FP1.
SK_SC:
    extra_params: "-snake_queue_size 128
    \n-snake_max_chain_depth 10
    \n-snake_chain_deep_promoted 1
    \n-snake_intra_distance 8
    \n-snake_intra_distance_mode 0
    \n-snake_interwarp_scope 1
    \n-snake_interwarp_degree 63
    \n-snake_promote_warps 3
    \n-snake_intra_confirm_warps 3
    \n-snake_interwarp_min_warps 3"
# SK_SC with the inter-warp targets kept in the warp's CTA (up to 63); use
# after SK_SC (the later value wins).
SK_SC_CTA:
    extra_params: "-snake_interwarp_scope 0"
# SnakeCharmer's Head table (Table III: 64 entries of 10 B, indexed by warp
# ID; §III-A: inter-warp strides from consecutive warps at the same load PC):
# inter-warp training reads the per-warp Head registers (nearest warp IDs
# whose last load was this PC) instead of the per-PC rows of two warps.
SNAKE_HEAD64:
    extra_params: "-snake_head_two_warps 0"
# Decoupling off; throttling stays on (SK match, Step 1)
SNAKE_DM0:
    extra_params: "-snake_decouple_mode 0"
# R2 (docs/snake/R2_SPEC.md, SPEC OQ-38): prefetches wait in a separate
# 128-sector prefetch queue and share the L1D -> interconnect injection
# point (one request per cycle) with the miss queue; demand first, line and
# MSHR taken when the prefetch is sent.  SNAKE_PQARB1: round-robin;
# SNAKE_PQMSHR1: line and MSHR taken at enqueue.
SNAKE_R2:
    extra_params: "-snake_pq_path 1
    \n-snake_pq_arb 0
    \n-snake_pq_mshr 0"
SNAKE_PQARB1:
    extra_params: "-snake_pq_arb 1"
SNAKE_PQMSHR1:
    extra_params: "-snake_pq_mshr 1"

# S6 IPC investigation: the latency ceiling.  L1 misses still use the L1D and
# its miss queue, but the memory system answers at once (no L2/DRAM latency);
# the most a prefetcher could gain in this simulator.
PERFECT_MEM:
    extra_params: "-gpgpu_perfect_mem 1"

# D1 ceiling: every L1-cached global load hits in the L1D at L1 latency (a
# perfect prefetcher); stores and L1-bypassing loads are unchanged.
PERFECT_L1D:
    extra_params: "-gpgpu_perfect_l1d 1"

# One LRR scheduler per SM without the sub-core model, so the warps of a CTA
# issue strictly round robin, as in the paper's Fig. 15 example.
SYNTH_LRR1:
    extra_params: "-gpgpu_scheduler lrr
    \n-gpgpu_num_sched_per_core 1
    \n-gpgpu_sub_core_model 0"
